name: Ex10 CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-ex10-nginx:latest \
            ./app

      - name: Push Docker Image
        run: |
          docker push \
            925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-ex10-nginx:latest

      - name: Start CodePipeline
        run: |
          aws codepipeline start-pipeline-execution \
            --name std01-ex10-asg-cicd-pipeline
